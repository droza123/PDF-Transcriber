name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Retry loops guard against transient 504s from GitHub's release CDN
      # (electron zip, NSIS, winCodeSign downloads all come from there).
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $i failed — retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Build installer
        shell: bash
        run: |
          npx vite build
          for i in 1 2 3; do
            npx electron-builder --win --publish never && exit 0
            echo "electron-builder attempt $i failed — retrying in 60s..."
            sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $i failed — retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Build installer
        shell: bash
        run: |
          npx vite build
          for i in 1 2 3; do
            npx electron-builder --mac --publish never && exit 0
            echo "electron-builder attempt $i failed — retrying in 60s..."
            sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: release/*.dmg

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            artifacts/windows-installer/*.exe \
            artifacts/mac-installer/*.dmg
